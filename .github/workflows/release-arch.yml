name: Release (Arch package)

# A tag like v1.2.3 becomes a pacman package plus a repository database named
# aoide-linux on the GitHub release, so `pacman -Syu` sees it. The package is
# packaging/arch/PKGBUILD; it installs beside the Electron app's `aoide`.
on:
  push:
    tags: ['v*']
  # Run by hand with a tag, it builds that tag's source with this
  # workflow's packaging (for a tag whose own run failed) and attaches it.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach to, e.g. v1.2.3'
        required: false
        type: string

# makepkg runs every crate's build script with a read-only token; only the
# release job, which builds nothing, may write.
permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    container:
      # Pinned by digest; makepkg's -Syu still brings the packages up to date.
      image: archlinux@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0

    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm base-devel git rustup pkgconf alsa-lib dbus
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          sudo -u builder rustup default stable

      - name: Check out the tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build the package
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          cp -r packaging/arch /tmp/pkg
          chown -R builder /tmp/pkg
          cd /tmp/pkg
          # The tag's own tarball; CI stamps the version so pkgver() need not.
          sed -i "s/^pkgver=.*/pkgver=$version/" PKGBUILD
          sudo -u builder makepkg --noconfirm --syncdeps --skipchecksums
          mkdir -p /tmp/out
          mv ./*.pkg.tar.zst /tmp/out/
          cd /tmp/out
          repo-add aoide-linux.db.tar.gz ./*.pkg.tar.zst
          # repo-add leaves symlinks; releases want files.
          for link in aoide-linux.db aoide-linux.files; do
            cp --remove-destination "$(readlink -f "$link")" "$link"
          done
          sha256sum -- *.pkg.tar.zst aoide-linux.db aoide-linux.db.tar.gz \
              aoide-linux.files aoide-linux.files.tar.gz > SHA256SUMS-arch
          ls -la

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aoide-linux-arch
          path: /tmp/out/*

  release:
    needs: package
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the signing script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: packaging/sign.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aoide-linux-arch
          path: out

      # pacman fetches FILE.sig beside each package and the database.
      - name: Sign
        env:
          AOIDE_SIGNING_KEY: ${{ secrets.AOIDE_SIGNING_KEY }}
          AOIDE_SIGNING_PASSPHRASE: ${{ secrets.AOIDE_SIGNING_PASSPHRASE }}
        run: packaging/sign.sh out/*.pkg.tar.zst out/aoide-linux.db out/aoide-linux.db.tar.gz out/aoide-linux.files out/aoide-linux.files.tar.gz out/SHA256SUMS-arch

      - name: Attach to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            out/*.pkg.tar.zst
            out/aoide-linux.db
            out/aoide-linux.db.tar.gz
            out/aoide-linux.files
            out/aoide-linux.files.tar.gz
            out/SHA256SUMS-arch
            out/*.sig
          tag_name: ${{ inputs.tag || github.ref_name }}
