name: Release (Flatpak)

# Builds packaging/flatpak/io.github.Virel0.Aoide.Linux.yml into a single-file
# bundle, aoide-linux.flatpak. This is the only place the manifest is built,
# so it also runs when the Flatpak packaging changes, to find a broken
# manifest before a release does.
#
# A release is finished by running this by hand with the tag (one click on
# the Actions page), as for the Electron app: the release itself is made by
# the tag workflows, and a release made with their token starts no workflow.
on:
  push:
    branches: [main]
    paths:
      - 'packaging/flatpak/**'
      - 'packaging/arch/io.github.Virel0.Aoide.Linux.desktop'
      - '.github/workflows/release-flatpak.yml'
  pull_request:
    paths:
      - 'packaging/flatpak/**'
      - 'packaging/arch/io.github.Virel0.Aoide.Linux.desktop'
      - '.github/workflows/release-flatpak.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach the bundle to, e.g. v1.2.3 (empty: build only)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  # flatpak-builder builds offline, so the crates are fetched first, here,
  # with the same Cargo.lock. See the manifest's header for why this and not
  # a generated cargo-sources.json.
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - name: Vendor the crates
        run: |
          set -euo pipefail
          cargo vendor --locked target/flatpak-vendor > /dev/null
          tar -C target -cf flatpak-vendor.tar flatpak-vendor

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-vendor
          path: flatpak-vendor.tar
          retention-days: 1

  flatpak:
    needs: vendor
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Flathub's own build image: Flatpak, flatpak-builder and the 26.08
    # runtime, pinned by digest (the freedesktop-26.08 tag when pinned).
    # bubblewrap needs --privileged inside a container; the job's token is
    # read-only, and only the release job below may write. The runner's
    # preinstalled toolkits are mounted so the first step can delete them:
    # with about 7 GB free the build ran out of disk (os error 28, then ld
    # dying with SIGBUS), and a container step can't reach the host's disk
    # otherwise.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:6ed6921bb5a9e1a916989971844f159b854b7b225880c381fa34f7a158863039
      options: >-
        --privileged
        -v /usr/local/lib/android:/host/android
        -v /usr/share/dotnet:/host/dotnet
        -v /opt/hostedtoolcache:/host/toolcache
        -v /opt/ghc:/host/ghc
        -v /usr/share/swift:/host/swift
    defaults:
      run:
        shell: bash

    steps:
      - name: Free the runner's disk
        run: |
          df -h /
          find /host -mindepth 2 -maxdepth 2 -exec rm -rf {} +
          df -h /

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-vendor

      - name: Unpack the vendored crates
        run: |
          set -euo pipefail
          mkdir -p target
          tar -C target -xf flatpak-vendor.tar
          rm flatpak-vendor.tar

      - name: Build the Flatpak
        run: |
          set -euo pipefail
          # cargo's target folder lives in the state dir.
          work=/tmp/aoide-linux-flatpak
          mkdir -p "$work"
          echo "AOIDE_FLATPAK_WORK=$work" >> "$GITHUB_ENV"
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # FUSE is not available in the container, hence no rofiles-fuse.
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
              --force-clean --repo="$work/repo" \
              --state-dir="$work/state" \
              "$work/build" \
              packaging/flatpak/io.github.Virel0.Aoide.Linux.yml
          df -h "$work"

      # With the SDK's own tool, which the build has just installed. The
      # AppStream data is validated in CI (ci.yml): the 26.08 SDK has no
      # appstreamcli.
      - name: Validate the desktop entry
        run: |
          set -euo pipefail
          sdk() {
              # --user: the build installed the SDK there, and the image has
              # one of its own, which left `flatpak run` no single ref to pick.
              flatpak run --user --filesystem="$PWD":ro --command="$1" org.freedesktop.Sdk/x86_64/26.08 "${@:2}"
          }
          sdk desktop-file-validate "$PWD/packaging/arch/io.github.Virel0.Aoide.Linux.desktop"

      - name: Bundle it
        run: |
          set -euo pipefail
          flatpak build-bundle "$AOIDE_FLATPAK_WORK/repo" aoide-linux.flatpak \
              io.github.Virel0.Aoide.Linux \
              --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          ls -lh aoide-linux.flatpak
          sha256sum aoide-linux.flatpak > SHA256SUMS-flatpak

      - name: Keep it for inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aoide-linux-flatpak
          path: |
            aoide-linux.flatpak
            SHA256SUMS-flatpak

  release:
    needs: flatpak
    if: inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the signing script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            packaging/sign.sh
            packaging/attach-release.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aoide-linux-flatpak

      - name: Sign
        env:
          AOIDE_SIGNING_KEY: ${{ secrets.AOIDE_SIGNING_KEY }}
          AOIDE_SIGNING_PASSPHRASE: ${{ secrets.AOIDE_SIGNING_PASSPHRASE }}
        run: packaging/sign.sh aoide-linux.flatpak SHA256SUMS-flatpak

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: packaging/attach-release.sh "$TAG" aoide-linux.flatpak SHA256SUMS-flatpak ./*.sig
