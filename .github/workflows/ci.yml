name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config dbus
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Desktop entry and AppStream data
        run: |
          sudo apt-get install -y appstream desktop-file-utils
          desktop-file-validate packaging/arch/io.github.Virel0.Aoide.Linux.desktop
          appstreamcli validate --no-net packaging/flatpak/io.github.Virel0.Aoide.Linux.metainfo.xml
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The project's size limits, as warnings on the run (never a failure):
      # functions over 100 lines, and source files over 800.
      - name: Size report
        run: |
          printf 'too-many-lines-threshold = 100\n' > "$RUNNER_TEMP/clippy.toml"
          CLIPPY_CONF_DIR="$RUNNER_TEMP" cargo clippy --workspace --lib --bins --message-format=short -- \
            -A clippy::all -W clippy::too_many_lines 2>&1 \
            | sed -n 's/^\([^:]*\):\([0-9]*\):[0-9]*: warning: this function has too many lines (\([0-9]*\)\/100)/::warning file=\1,line=\2::function of \3 lines (limit 100)/p'
          git ls-files '*.rs' | grep -v '/tests/' | xargs wc -l \
            | awk '$2 != "total" && $1 > 800 { print "::warning file=" $2 "::" $1 " lines (limit 800)" }'
      - name: MPRIS, single instance and sleep inhibit, on a private D-Bus
        run: cargo test -p aoide-mpris -- --include-ignored
      - name: The keyring, against GNOME Keyring on a private D-Bus
        run: |
          sudo apt-get install -y gnome-keyring
          dbus-run-session -- sh -c 'printf ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null && cargo test -p aoide-app -- --ignored keyring'
