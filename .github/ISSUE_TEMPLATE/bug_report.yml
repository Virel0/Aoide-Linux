name: Bug report
description: Something in Aoide for Linux doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please leave out anything private: your server's address, usernames, tokens and API keys. A security problem goes through private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open an album
        2. Press Play
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Aoide version
      description: The release, or the commit for a build from source.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How it is installed
      options:
        - pacman repository
        - Flatpak
        - AppImage
        - deb
        - Built from source
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Distribution and desktop
      description: For example Arch with KDE Plasma 6 on Wayland, or Ubuntu 24.04 with GNOME.
    validations:
      required: true
  - type: input
    id: jellyfin
    attributes:
      label: Jellyfin version, and the sidecar's if installed
      placeholder: "Jellyfin 10.11.0, sidecar 1.18.0.0"
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Run `aoide-linux` from a terminal, with Settings → System → Log set to Information or Debugging, and paste what it prints. Check it for addresses and names first.
      render: text
