[package]
name = "aoide-lyrics"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Furigana and dictionary-backed romaji for Japanese lyrics, through the lindera
# analyser with the IPADIC dictionary built in. Off by default: about 48 MB more
# binary, and the dictionary (13 MB) is downloaded from lindera.dev while
# building. The crate docs have the numbers.
furigana = ["dep:lindera"]

[dependencies]
# Lyrics, LyricLine and LyricWord are aoide-melete's: one shape for the panel.
aoide-melete = { path = "../aoide-melete" }
thiserror = "2.0.21"

lindera = { version = "6.2.0", default-features = false, features = ["embed-ipadic"], optional = true }
