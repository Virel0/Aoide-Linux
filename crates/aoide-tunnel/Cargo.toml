[package]
name = "aoide-tunnel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
getrandom = "0.3.4"
# WireGuard in userspace, as Melete's own tunnel runs it. ring, not the default
# aws-lc-rs: ring is the TLS stack's provider already, and aws-lc-sys carries the
# OpenSSL licence.
gotatun = { version = "=0.10.3", default-features = false, features = ["device", "ring"] }
ipnetwork = "0.21.1"
log = "0.4.35"
# The TCP/IP stack the app's connections ride on inside the tunnel, so it needs no
# TUN device or root.
smoltcp = { version = "=0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
zeroize = "1.9.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
serde_json = "1.0.154"
