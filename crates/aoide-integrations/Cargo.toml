[package]
name = "aoide-integrations"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# OpenRouter, GitHub and a LibreTranslate server over HTTPS, and URL parsing for Discord's links. The
# workspace's TLS line: rustls on ring, installed as the provider; never
# reqwest's default or `rustls` features, which bring aws-lc-rs.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Comparing the running version with the latest release's tag.
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
# Which language the lyrics are in: trigram detection, 69 languages, no models.
whatlang = { version = "0.18.0", default-features = false }
# Whose a Discord socket is (`getuid`, without unsafe code). Already in the
# tree through the window and D-Bus crates.
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }
# Discord's socket and its timers run on the app's tokio runtime.
tokio = { version = "1.54.1", default-features = false, features = ["sync", "time", "rt", "net", "io-util", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
