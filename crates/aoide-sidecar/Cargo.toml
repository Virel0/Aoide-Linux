[package]
name = "aoide-sidecar"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
aoide-store = { path = "../aoide-store" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# `rustls-no-provider`, not the default `rustls`: the default pulls in aws-lc-rs,
# whose aws-lc-sys carries the OpenSSL licence. ring is installed as the provider.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6.5"
