[package]
name = "aoide-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["furigana"]
# Lyric translation on this machine (Firefox Translations' models through
# fxtranslate, downloaded from Mozilla on first use). Off by default.
local-translation = ["aoide-integrations/local-translation"]
# Readings over kanji in Japanese lyrics, and romaji that reads kanji, through
# aoide-lyrics' lindera with IPADIC: about 48 MB more binary, and the
# dictionary is downloaded at build time (aoide-lyrics' docs; the Flatpak
# lists it as a source instead). On by default.
furigana = ["aoide-lyrics/furigana"]

[[bin]]
name = "aoide"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
aoide-audio = { path = "../aoide-audio" }
# Discord Rich Presence, OpenRouter (search by description, mixes), the update
# notice; lyric translation: the lyrics' language always, translating with the
# `local-translation` feature above.
aoide-integrations = { path = "../aoide-integrations" }
aoide-jellyfin = { path = "../aoide-jellyfin" }
# Internet lyrics (LRCLIB) for songs the server has none for.
aoide-lyrics = { path = "../aoide-lyrics" }
# MPRIS, single instance and sleep inhibit; on macOS it builds and reports
# itself unavailable.
aoide-mpris = { path = "../aoide-mpris" }
aoide-sidecar = { path = "../aoide-sidecar" }
aoide-store = { path = "../aoide-store" }
# Per-user config, data and cache directories (XDG on Linux).
directories = "6"
# `tokio` runs every Task on the runtime the Jellyfin client needs; `image` without
# its codec bundle, the three artwork formats are picked below; `svg` for the icons;
# `canvas` for the equaliser's curve and the visualizer.
iced = { version = "0.14", features = ["tokio", "image-without-codecs", "svg", "canvas"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# The log facade (already in the tree through iced); the app's own logger is logging.rs.
log = "0.4.34"
# Artwork downloads. The same TLS stack as every other crate: rustls on ring, never
# reqwest's `rustls` feature (aws-lc-rs).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The system's file dialog for choosing covers: NSOpenPanel on macOS, the XDG
# desktop portal over libdbus (loaded at run time) on Linux, zenity if neither.
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "sync", "macros"] }
uuid = { version = "1.29", features = ["v4"] }

# The system keyring holds the access token: Secret Service on Linux (pure-Rust
# crypto, no OpenSSL), the Keychain on macOS, where the app is developed.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
